server {
    listen       80;
    listen       443 ssl;
    server_name  localhost;

    ssl_certificate "/etc/nginx/conf.d/www.cti-group.com.hk.pem";
    ssl_certificate_key "/etc/nginx/conf.d/www.cti-group.com.hk.key";

    # ---- 全局安全响应头（适用于所有请求） ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---- 默认缓存策略：针对 HTML / 动态内容禁用缓存 ----
    # 注意：由于静态资源 location 中会覆盖，不会影响图片等
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;

    # 静态资源（图片、样式、脚本等）单独配置缓存，覆盖上面的 Cache-Control
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html/tobacco/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 安全头会从上层继承，无需重复
        # 如果希望完全继承，也可以显式写出，但 not needed
        try_files $uri =404;
    }

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        #root   /usr/share/nginx/html;
	root   /usr/share/nginx/html/tobacco/;
        index  index.html index.htm;
	try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

